# Push a tag like v1.0.1 -> tests run, a signed APK is built and published on the Releases page.
# Family download link (always the newest):
#   https://github.com/Jaydip591/Vahan-Khata/releases/latest/download/VahanKhata.apk
#
# Needs, in GitHub -> Settings -> Secrets and variables -> Actions:
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
#   Variables: API_BASE_URL  (the Render URL, e.g. https://vahan-khata-api.onrender.com)
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Check settings
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$API_BASE_URL" || { echo "Set the API_BASE_URL variable"; exit 1; }
          test -n "$KEYSTORE" || { echo "Set the ANDROID_KEYSTORE_BASE64 secret"; exit 1; }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/VahanKhata.apk"
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/VahanKhata.apk
          body: |
            **વાહન ખાતા ${{ github.ref_name }}**

            ઇન્સ્ટોલ કરવા:
            1. ફોનમાં નીચે **VahanKhata.apk** પર ટેપ કરો અને ડાઉનલોડ થવા દો.
            2. ડાઉનલોડ ખોલો. ફોન પૂછે તો "આ સ્ત્રોતમાંથી મંજૂરી આપો" (Allow from this source) ચાલુ કરો.
            3. **Install** દબાવો. જૂની એપ હોય તો તે અપડેટ થઈ જશે, ડેટા સર્વર પર સલામત છે.

            Install: tap **VahanKhata.apk** below, open the download, allow installs from this source if asked, tap Install.
